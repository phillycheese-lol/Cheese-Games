<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding-top: 50px;
        }
        .game-button {
            background-color: #4CAF50;
            color: white;
            font-size: 20px;
            padding: 15px 32px;
            margin: 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
        }
        .game-button:hover {
            background-color: #45a049;
        }
        .header {
            font-size: 40px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="header">Welcome to My Game Website!</div>
    <p>Select a game to play:</p>

    <!-- Links to games -->
    <a href="snake.html" class="game-button">Snake Game</a>
    <!-- Add more game buttons as you create new games -->
    <a href="game2.html" class="game-button">Game 2</a>
    <a href="game3.html" class="game-button">Game 3</a>

</body>
</html>
